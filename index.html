<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Photobooth Store CDN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #111; }
    code { background: #f3f3f3; padding: 2px 6px; border-radius: 4px; }
    li { margin: 6px 0; }
  </style>
</head>
<body>
  <h1>Photobooth Store</h1>
  <p>Static asset CDN for the Photobooth app. Frames and lenses are served as static files.</p>
  <ul>
    <li>Frames manifest: <a href="/frames.json"><code>/frames.json</code></a></li>
    <li>Lenses manifest: <a href="/lenses.json"><code>/lenses.json</code></a></li>
    <li>Frame images: <code>/frames/&lt;id&gt;.png</code></li>
    <li>Lens thumbnails: <code>/lenses/thumbs/&lt;thumbAsset&gt;.png</code></li>
    <li>Lens booth assets: <code>/lensbooth/...</code></li>
  </ul>
</body>
</html>
